# Maxtrader Content Engine configuration
# =======================================
# Secrets (API keys/tokens) go in .env — this file is safe to commit.
# Every field is optional; missing fields use built-in defaults.

brand:
  name: "Maxtrader Signals"
  tagline: "AI-driven market regime & rotation intelligence, daily."
  subject: "an automated adaptive rotation trading strategy's daily market signals"
  voice: >
    Confident, data-driven, concise. Explains quant concepts in plain
    English. Never hypes, never gives direct buy/sell advice.
  site_url: ""            # e.g. https://signals.example.com
  author: "Maxtrader Bot"

# Optional AI-influencer persona for character-consistent visuals in the
# production pack. Leave name empty for a faceless/brand-graphic channel.
persona:
  name: ""
  appearance: ""
  wardrobe: ""
  setting: ""
  style: ""

# Trend research (`run_content_pipeline.py research`)
research:
  geo: "US"
  subreddits: [investing, stocks]
  keywords: [market, fed, earnings, rotation, regime]
  include_hackernews: false

# Data source: this repo's own trading system output.
source:
  type: market
  trades_file: "trades.json"
  weights_dir: "src/strategies/output/weights/adaptive_rotation"
  facts_file: ""

llm:
  anthropic_model: "claude-sonnet-5"   # used if ANTHROPIC_API_KEY is set
  openai_model: "gpt-4o-mini"          # fallback if OPENAI_API_KEY is set
  max_tokens: 2000
  temperature: 0.7

channels:
  daily_brief: [blog, telegram, discord]
  social_thread: [twitter, telegram]
  newsletter: [buttondown, blog]
  video_script: [blog]
  production_pack: []    # internal working doc; add blog to publish it

newsletter_weekday: 6

media:
  enable_images: true
  enable_video: true
  use_ai_images: false
  openai_image_model: "gpt-image-1"
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM"
  openai_tts_model: "gpt-4o-mini-tts"
  openai_tts_voice: "onyx"
  seconds_per_slide: 6

monetization:
  newsletter_cta: "Get the daily signal in your inbox before the open."
  newsletter_signup_url: ""
  premium_cta: "Premium members get position-level weights and same-day rebalance alerts."
  premium_url: ""
  affiliates: []
  sponsor_slot: ""
  utm_source: "maxtrader"
  disclaimer: >
    This content is generated from an automated trading research system
    and is for informational and educational purposes only. It is not
    financial advice. Past performance does not guarantee future results.
    Do your own research before making investment decisions.
