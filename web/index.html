<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxtrader Signals — AI-driven market intelligence, daily</title>
<meta name="description" content="Automated daily market briefs from a live quant rotation model: regime detection, allocations, and portfolio pulse.">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--amber:#d29922}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px}
  header h1{color:var(--accent);font-size:2rem;letter-spacing:-.02em}
  header p{color:var(--muted);margin-top:6px}
  nav{margin:24px 0;display:flex;gap:8px;flex-wrap:wrap}
  nav button{background:var(--panel);color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.9rem}
  nav button.active{border-color:var(--accent);color:var(--accent)}
  #status{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  article{background:var(--panel);border:1px solid #30363d;border-radius:12px;padding:28px;overflow-x:auto}
  article h1{font-size:1.5rem;margin:0 0 16px}
  article h2{font-size:1.15rem;margin:22px 0 10px;color:var(--accent)}
  article h3{font-size:1rem;margin:18px 0 8px}
  article p{margin:10px 0}
  article ul{margin:10px 0 10px 22px}
  article li{margin:4px 0}
  article hr{border:0;border-top:1px solid #30363d;margin:20px 0}
  article em{color:var(--muted)}
  article a{color:var(--accent)}
  .badge{display:inline-block;background:var(--amber);color:var(--bg);border-radius:6px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-left:8px;vertical-align:middle}
  .cta{display:block;text-align:center;background:var(--accent);color:var(--bg);font-weight:700;border-radius:10px;padding:14px;margin-top:28px;text-decoration:none}
  footer{color:var(--muted);font-size:.8rem;margin-top:36px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="brand">Maxtrader Signals</h1>
    <p id="tagline">AI-driven market regime &amp; rotation intelligence, daily.</p>
  </header>
  <nav>
    <button data-type="daily_brief" class="active">Daily Brief</button>
    <button data-type="social_thread">Thread</button>
    <button data-type="newsletter">Newsletter</button>
    <button data-type="video_script">Video Script</button>
    <button data-type="production_pack">Production Pack</button>
  </nav>
  <div id="status">Loading today's signal…</div>
  <article id="content"></article>
  <a id="signup" class="cta" href="#" style="display:none">📬 Get the free daily brief in your inbox</a>
  <footer>
    Generated automatically from a live quant rotation model.
    Informational and educational only — not financial advice.
  </footer>
</div>
<script>
// Minimal markdown renderer (headings, bold, italics, links, lists, hr)
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  return s
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" rel="noopener" target="_blank">$1</a>');
}
function md(src){
  const out=[]; let list=false;
  for(const raw of src.split("\n")){
    const line=esc(raw);
    if(/^\s*[-•]\s+/.test(line)){ if(!list){out.push("<ul>");list=true} out.push("<li>"+inline(line.replace(/^\s*[-•]\s+/,""))+"</li>"); continue }
    if(list){out.push("</ul>");list=false}
    if(/^###\s+/.test(line)) out.push("<h3>"+inline(line.slice(4))+"</h3>");
    else if(/^##\s+/.test(line)) out.push("<h2>"+inline(line.slice(3))+"</h2>");
    else if(/^#\s+/.test(line)) out.push("<h1>"+inline(line.slice(2))+"</h1>");
    else if(/^---+$/.test(line.trim())) out.push("<hr>");
    else if(line.trim()==="") out.push("");
    else out.push("<p>"+inline(line)+"</p>");
  }
  if(list) out.push("</ul>");
  return out.join("\n");
}
async function load(type){
  const status=document.getElementById("status"), art=document.getElementById("content");
  status.textContent="Generating today's "+type.replace("_"," ")+"…";
  try{
    const r=await fetch("/api/brief?type="+type);
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    document.getElementById("brand").textContent=d.brand;
    document.getElementById("tagline").textContent=d.tagline;
    art.innerHTML=md(d.markdown.replace(/\n---\n/g,"\n\n---\n\n"));
    status.innerHTML="Updated "+d.as_of+" · written by <b>"+d.provider+"</b>"+(d.demo_data?' <span class="badge">SAMPLE DATA</span>':"");
    const cta=document.getElementById("signup");
    if(d.signup_url){cta.href=d.signup_url;cta.style.display="block"}
  }catch(e){ status.textContent="Could not load content: "+e.message; }
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); load(b.dataset.type);
}));
load("daily_brief");
</script>
</body>
</html>
